<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>世界同类能源企业动态跟踪-中国华能集团能源研究院 | 2026</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div>
          <p class="eyebrow">2026 年度跟踪</p>
          <h1>世界同类能源企业动态跟踪-中国华能集团能源研究院</h1>
          <p class="subtitle">按公司归档，按时间排序，官网来源优先；官网不足时补充权威媒体并标注来源类型。</p>
        </div>
        <div class="summary-panel" aria-label="更新概览">
          <span id="last-updated">更新中</span>
          <strong id="event-count">0</strong>
          <span>条已录入事件</span>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换深色模式">🌙</button>
      </div>
    </header>

    <main>
      <section class="toolbar" aria-label="筛选">
        <label>
          公司
          <select id="company-filter"></select>
        </label>
        <label>
          地区
          <select id="region-filter">
            <option value="all">全部</option>
            <option value="海外">海外</option>
            <option value="中国">中国</option>
          </select>
        </label>
        <label>
          季度
          <select id="quarter-filter">
            <option value="all">全部</option>
            <option value="Q1">一季度</option>
            <option value="Q2">二季度</option>
            <option value="Q3">三季度</option>
            <option value="Q4">四季度</option>
          </select>
        </label>
        <label>
          重要性
          <select id="importance-filter">
            <option value="all">全部</option>
            <option value="高">高</option>
            <option value="中">中</option>
            <option value="低">低</option>
          </select>
        </label>
        <label class="search-label">
          检索
          <div class="search-wrap">
            <input id="search-input" type="search" placeholder="关键词、业务、来源" />
            <button id="search-clear" type="button" class="search-clear" hidden aria-label="清空搜索">×</button>
          </div>
        </label>
        <label class="export-label">
          <span style="visibility:hidden">导出</span>
          <button id="export-btn" type="button" class="export-btn">导出当前筛选结果</button>
        </label>
      </section>

      <div id="filter-result" class="filter-result" hidden></div>

      <section class="metrics" aria-label="覆盖情况">
        <div>
          <span>公司数量</span>
          <strong id="company-count">23</strong>
        </div>
        <div>
          <span>官网来源占比</span>
          <strong id="official-ratio">0%</strong>
        </div>
        <div>
          <span>本季度缺口</span>
          <strong id="coverage-gap">0</strong>
        </div>
      </section>

      <section id="trend-overview" class="trend-overview" aria-label="季度发展趋势"></section>

      <section id="data-overview" class="data-overview" aria-label="季度数据概览">
        <div class="section-head">
          <div>
            <p class="section-kicker">数据概览</p>
            <h2>当前筛选数据统计</h2>
          </div>
          <div style="display:flex;gap:8px;align-items:center;">
            <button id="ai-analyze-btn" class="ai-analyze-btn" type="button">智能分析趋势</button>
            <span class="badge">可视化</span>
          </div>
        </div>
        <div class="overview-grid">
          <div class="overview-card">
            <h3>各公司新闻数量</h3>
            <div id="company-bar-chart" class="bar-chart"></div>
          </div>
          <div class="overview-card">
            <h3>来源与重要性分布</h3>
            <div class="donut-row">
              <div class="donut-item">
                <div id="source-donut" class="donut"></div>
                <p class="donut-label">来源占比</p>
              </div>
              <div class="donut-item">
                <div id="importance-donut" class="donut"></div>
                <p class="donut-label">重要性分布</p>
              </div>
            </div>
          </div>
        </div>
        <div id="ai-analysis-result" class="ai-analysis-result" hidden>
          <div class="ai-analysis-head">
            <h3>智能趋势分析</h3>
            <button id="copy-analysis-btn" class="copy-analysis-btn" type="button">复制文本</button>
          </div>
          <div id="ai-analysis-content" class="ai-analysis-content"></div>
        </div>
      </section>

      <section id="tag-cloud" class="tag-cloud-section" aria-label="热点标签">
        <div class="section-head">
          <div>
            <p class="section-kicker">热点标签</p>
            <h2>当前筛选下的高频主题</h2>
          </div>
          <span class="badge">标签云</span>
        </div>
        <div id="tag-cloud-content" class="tag-cloud-content"></div>
      </section>

      <div class="view-toggle-bar">
        <span class="view-toggle-label">视图：</span>
        <div class="view-toggle-group">
          <button id="view-company" class="view-toggle-btn active" type="button">按公司分组</button>
          <button id="view-timeline" class="view-toggle-btn" type="button">按时间排序</button>
        </div>
        <button id="compare-toggle-btn" class="compare-toggle-btn" type="button">公司对比</button>
      </div>

      <section id="compare-panel" class="compare-panel" hidden>
        <div class="compare-selector">
          <label>
            公司A
            <select id="compare-company-a"></select>
          </label>
          <span class="compare-vs">VS</span>
          <label>
            公司B
            <select id="compare-company-b"></select>
          </label>
          <button id="start-compare-btn" class="start-compare-btn" type="button">开始对比</button>
        </div>
        <div id="compare-result" class="compare-result" hidden></div>
      </section>

      <section id="company-list" class="company-list" aria-live="polite"></section>
    </main>

    <footer>
      <p>采集起点：2026-01-01。每家公司每季度目标不少于 5 条重大事件；官网不足时使用新华社、国资委、交易所公告、主流财经媒体等补充。</p>
    </footer>

    <script src="data/news-data.js?v=20260829"></script>
    <script src="app.js?v=20260829"></script>
  </body>
</html>
